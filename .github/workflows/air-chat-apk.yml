name: AIR Chat APK

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: air-chat-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      RVX_DEBUG_APP_NAME: "AIR Chat"
      RVX_BUILD_FLAVOUR_ID: "AIRC"
      RVX_SENTRY_DSN: ""
      RVX_SENTRY_UPLOAD_MAPPINGS: "false"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvm.options=-Xmx4g"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Prepare build files
        run: |
          chmod +x gradlew
          [ -f app/google-services.json ] || cp app/google-services.json.example app/google-services.json

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/AIR-Chat-${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIR-Chat-apk
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: air-chat-build-${{ github.run_number }}
          name: AIR Chat (build ${{ github.run_number }})
          body: |
            APK Android d'AIR Chat, généré automatiquement depuis la branche `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Téléchargez le fichier `.apk` ci-dessous et installez-le sur votre téléphone.
          files: out/*.apk
          make_latest: true
