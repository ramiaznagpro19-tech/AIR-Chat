name: AIR Chat backend test

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

concurrency:
  group: air-chat-backend-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      RVX_DEBUG_APP_NAME: "AIR Chat"
      RVX_BUILD_FLAVOUR_ID: "AIRC"
      RVX_SENTRY_DSN: ""
      RVX_SENTRY_UPLOAD_MAPPINGS: "false"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dkotlin.daemon.jvm.options=-Xmx4g"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare build files
        run: |
          chmod +x gradlew
          [ -f app/google-services.json ] || cp app/google-services.json.example app/google-services.json
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Build app and test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare the PC side (AIR Chat for PC backend)
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          npm rebuild node-datachannel

      - name: Run backend test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c || true
            nohup node desktop/test/pcbot.mjs pcbot${{ github.run_number }} > pcbot.log 2>&1 &
            nohup node desktop/test/pcdevice.mjs phone${{ github.run_number }} 'abcd123!?' > pcdevice.log 2>&1 &
            adb install -r -g app/build/outputs/apk/debug/*.apk
            adb install -r -g app/build/outputs/apk/androidTest/debug/*.apk
            adb shell am instrument -w -r -e class chat.stoat.air.AirBackendTest -e pcbot pcbot${{ github.run_number }} -e user phone${{ github.run_number }} $(adb shell pm list instrumentation | grep -o 'instrumentation:[^ ]*' | grep -i test | head -1 | cut -d: -f2) | tee instrument.txt || true
            adb shell am instrument -w -r -e class chat.stoat.air.AirScreenshotTest -e pcbot pcbot${{ github.run_number }} -e user phone${{ github.run_number }} $(adb shell pm list instrumentation | grep -o 'instrumentation:[^ ]*' | grep -i test | head -1 | cut -d: -f2) | tee screenshots.txt || true
            mkdir -p shots && SHOTS=$(grep -o 'AIRSHOT SUMMARY count=[0-9]* dir=[^ ]*' screenshots.txt | sed 's/.*dir=//' | tr -d '\r' | head -1) && [ -n "$SHOTS" ] && adb pull "$SHOTS/." shots/ || true
            grep AIRSHOT screenshots.txt | head -60 || true
            cat pcbot.log || true
            cat pcdevice.log || true
            adb logcat -d | grep -E "AIRTEST|AirBackendTest|AndroidRuntime|AirLocalServer|FATAL" | head -400 | tee logcat.txt || true

      - name: Publish the phone screenshots (branch "screenshots")
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] && [ "$(ls shots | wc -l)" -gt 0 ] || { echo "no screenshots"; exit 0; }
          git config user.name "AIR Chat CI"
          git config user.email "ci@air-chat.invalid"
          git fetch origin screenshots || true
          git worktree add -B screenshots ../shots-branch origin/screenshots 2>/dev/null || git worktree add --orphan -b screenshots ../shots-branch || git worktree add -B screenshots ../shots-branch
          rm -rf ../shots-branch/mobile && mkdir -p ../shots-branch/mobile && cp shots/*.png ../shots-branch/mobile/
          cd ../shots-branch && git add -A mobile && git commit -m "Captures d'écran mobile (run ${{ github.run_number }})" && for i in 1 2 3 4; do git push origin screenshots && break; git pull --rebase origin screenshots; done || true

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: air-chat-backend-test-logs
          path: |
            instrument.txt
            logcat.txt
